<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>PetroMath: Offline</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(135deg, #343a40 0%, #212529 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .box { padding: 24px; max-width: 320px; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { font-size: 15px; color: rgba(255, 255, 255, 0.75); margin: 0 0 24px; line-height: 1.45; }
    button {
      height: 48px; padding: 0 28px; border: 0; border-radius: 24px;
      background: #f4d046; color: #212529; font-size: 16px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/images/app-icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>PetroMath needs internet. Check your mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>
    // Reload by itself as soon as the connection is back
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
